name: Tier 0 — Unit (Linux)

on:
  push:
    branches: [main]
  pull_request:

# Deps are resolved from pyproject.toml via uv, so the toolchain pins live in
# one place. Tier 0 must run without ComfyUI; the in-tree purity gate
# (tests/unit/test_tier0_purity.py) enforces that the suite hasn't started
# leaking framework imports.
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --no-install-project

      - name: Run Tier 0
        run: uv run pytest -m unit tests/ -v
