name: Tier 2 — M2 / ANE (self-hosted)

on:
  pull_request:
    types: [labeled]
  schedule:
    # Nightly at 04:00 UTC (~05/06 in PL). Keeps the M2 path honest
    # without burning the runner on every PR.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  m2:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-m2'))
    # Self-hosted Mac registered by the maintainer. See docs/ci-m2.md
    # for runner setup and required model paths.
    runs-on: [self-hosted, macOS, ARM64, coreml]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: uv sync
        run: uv sync

      - name: Update ComfyUI to latest master (canary)
        # Tier 2 deliberately tracks the moving host: every run resets the
        # runner's ComfyUI checkout to origin/master and records the resolved
        # SHA, so upstream API breakage surfaces here instead of in a user's
        # install. (pyproject `requires-comfyui` stays the published-compat
        # declaration; this lane is the early-warning canary, not the contract.)
        # COMFY_DIR is exported by the self-hosted runner's .env (see docs/ci-m2.md).
        # The node under test lives at $COMFY_DIR/custom_nodes/ComfyUI-CoreMLSuite,
        # symlinked to $GITHUB_WORKSPACE at runner-setup time, so this reset does
        # not touch the checkout being validated.
        run: |
          git -C "$COMFY_DIR" fetch --quiet origin
          git -C "$COMFY_DIR" checkout --quiet master \
            || git -C "$COMFY_DIR" checkout --quiet -b master origin/master
          git -C "$COMFY_DIR" reset --hard --quiet origin/master
          COMFY_SHA="$(git -C "$COMFY_DIR" rev-parse HEAD)"
          echo "COMFY_SHA=$COMFY_SHA" >> "$GITHUB_ENV"
          echo "Tier 2 tested against ComfyUI \`$COMFY_SHA\` (latest master)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Start ComfyUI server (background)
        run: |
          cd "$COMFY_DIR"
          nohup "$GITHUB_WORKSPACE/.venv/bin/python" main.py --port 8188 --cpu-vae > /tmp/comfyui-ci.log 2>&1 &
          # Poll the HTTP endpoint for readiness — robust to startup-banner
          # wording / colored-log changes in a floating-latest ComfyUI.
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8188/system_stats; then
              echo "comfy ready (ComfyUI ${COMFY_SHA:-unknown})"; exit 0
            fi
            sleep 2
          done
          echo "comfy failed to start"; tail -100 /tmp/comfyui-ci.log; exit 1

      - name: Run Tier 2 (m2 marker)
        run: uv run pytest -m m2 tests/ -v

      - name: Run bench harness
        run: |
          uv run python bench/run.py \
            --model "$COMFY_DIR/models/unet/v1-5-pruned-emaonly_1x512x512_se_unet.mlmodelc" \
            --compute-units CPU_AND_NE CPU_AND_GPU \
            --repeats 30 --assumed-steps 20

      - name: Upload bench results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results/*.json

      - name: Stop ComfyUI server
        if: always()
        run: pkill -f "main.py.*8188" || true
