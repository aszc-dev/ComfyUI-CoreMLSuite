name: Tier 1 — Smoke (macOS self-hosted)

# macOS smoke tests run on the self-hosted Apple Silicon runner instead of
# GitHub-hosted macOS (10x minute multiplier), which exhausts the included
# Actions minutes too quickly.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: [self-hosted, macOS, ARM64, coreml]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --no-install-project

      - name: Run Tier 1 (synthetic micro-UNet smoke)
        run: uv run pytest -m smoke tests/ -v
