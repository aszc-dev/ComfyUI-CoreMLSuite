[project]
name = "comfyui-coremlsuite"
description = "This extension contains a set of custom nodes for ComfyUI that allow you to use Core ML models in your ComfyUI workflows."
version = "2.0.2"
license = "MIT"
requires-python = ">=3.12,<3.13"
packages = [{ include = "coreml_suite" }]
dependencies = [
    "coreml-diffusion",
    "torch>=2.7,<2.8",
    "coremltools>=9,<10",
    "numpy>=2,<3",
    # diffusers is still imported directly by the comfy-side LCM converter
    # (coreml_suite/lcm/converter.py) until E-LCM folds it into the package.
    "diffusers>=0.30",
]

[project.urls]
Repository = "https://github.com/aszc-dev/ComfyUI-CoreMLSuite"

[tool.uv.sources]
# Local path until coreml-diffusion is published (GitHub/PyPI). Switch to
# `{ git = "...", tag = "vX.Y.Z" }` once the repo exists so CI can resolve it.
coreml-diffusion = { path = "../../../coreml-diffusion", editable = true }

[tool.comfy]
PublisherId = "aszc-dev"
DisplayName = "ComfyUI-CoreMLSuite"
Icon = ""
requires-comfyui = ">=0.3.27"

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
]
comfy = [
    "comfyui-frontend-package==1.14.6",
    "torchvision",
    "torchaudio",
    "torchsde",
    "einops",
    "tokenizers>=0.13.3",
    "safetensors>=0.4.2",
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "kornia>=0.7.1",
    "spandrel",
    "soundfile",
    "sentencepiece",
]

[tool.pytest.ini_options]
markers = [
    "unit: framework-free unit test (Tier 0)",
    "smoke: macOS-ARM smoke test on a synthetic micro-model (Tier 1)",
    "m2: requires Apple Silicon + Neural Engine (Tier 2)",
]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--confcutdir=tests"]
